<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои транзакции</title>
</head>
<body>
    <h1>Мои транзакции</h1>
    <a href="{% url 'add_transaction' %}">+ Добавить</a>

    <ul>
        {% for t in transactions %}
            <li>
                {{ t.date }} — {{ t.get_type_display }} — {{ t.amount }} — {{ t.category.name }}
                {% if t.description %} ({{ t.description }}) {% endif %}
            </li>
        {% empty %}
            <li>Пока нет транзакций.</li>
        {% endfor %}
    </ul>
</body>
</html>
