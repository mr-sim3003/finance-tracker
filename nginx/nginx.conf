upstream django {                                                    # Обращаемся к контейнеру web по имени сервиса и порту, который слушает Gunicorn
     server web:8000; 

}    
                                                  #upstream — это директива Nginx, которая создает «пул» серверов для перенаправления запросов (балансировка нагрузки).
                                                 #Сейчас у нас там один сервер, но если бы их было 5, Nginx распределял бы запросы между ними.
                                                      #django — это просто имя, которое мы дали этому пулу. Мы будем ссылаться на него ниже (proxy_pass http://django;).
                                                      #server web:8000; — вот тут происходит магия Docker.
                                                      #Внутри сети Docker контейнер web (где крутится Gunicorn) доступен по имени web (имя сервиса из docker-compose.yml).
                                                      #Nginx обращается к нему на порт 8000. Важно: это внутренний порт контейнера, снаружи он закрыт.
    

# браузер ---> 80 порт ---> nginx(сервер) --->  web:8000 ---> Gunicorn(сервер) ---> USGIHandler ---> Django
server {                                                    #Это конфигурация виртуального сервера. 
    listen 80;                                              #В одном файле может быть несколько блоков server (например, для localhost и для mysite.com).
                                                            #Nginx «слушает» 80-й порт (стандартный порт HTTP).          
                                                            #Именно сюда приходят запросы от браузера, когда ты пишешь http://127.0.0.1/ (без порта, потому что 80 — это дефолт). 
                                                      
    server_name 194.113.35.11;                                  #имя хоста, на которое отвечает этот сервер.                  
                                                            #Если к серверу обратятся по домену example.com, этот блок сработает только если server_name совпадет 
                                                            #(или если это дефолтный сервер). Для локальной разработки localhost — то, что нужно.                                                                                                                                                        
    client_max_body_size 10M; 
                                                             # Это защита. Nginx по умолчанию отклонит запросы, тело которых больше 1 МБ. 
                                                             #Если ты захочешь загрузить большой CSV-файл в трекер, Nginx вернет ошибку 413 Request Entity Too Large.
    

                                                            #location — это «маршрутизатор» Nginx. Он говорит: «Если URL начинается с /static/, делай то, что в скобках».
    location /static/ {
        alias /app/static/;
    } 
                                                                #alias /app/static/; — отдает файлы напрямую с диска (внутри контейнера Nginx), минуя Django. 
                                                                #Это критически важно для производительности. Отдавать картинку через Python-код — это медленно. 
                                                                #Nginx делает это в 10-100 раз быстрее.

                                                                # Все остальные запросы идут в Django
                                                                #location / — «если URL любой другой (не /static/), делай следующее». Это ловит все запросы к API и админке.
    location / {
        proxy_pass http://django; 
                                                                    #перенаправь запрос в тот самый пул upstream django (который ведет на web:8000). 
                                                                    #Это и есть передача эстафеты от Nginx к Gunicorn.

        proxy_set_header Host $host;
                                                                    #proxy_set_header ... ---это самый важный блок для Django. Когда Nginx пересылает запрос, он по умолчанию скрывает реальные данные клиента.
                                                                    # Эти заголовки «пробрасывают» их внутрь:
                                                                    #Host $host — передает оригинальный домен (чтобы Django понимал, какой сайт запрашивают).

        proxy_set_header X-Real-IP $remote_addr;
                                                                    #X-Real-IP $remote_addr — передает реальный IP-адрес клиента 
                                                                    #(без этого Django будет думать, что запрос пришел от Nginx, то есть от 127.0.0.1).

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                                                                    #X-Forwarded-For — стандартный заголовок для цепочки прокси (если серверов несколько).

        proxy_set_header X-Forwarded-Proto $scheme;
                                                                    #X-Forwarded-Proto $scheme — передает протокол (http или https). 
                                                                    #Это нужно, чтобы Django не сходил с ума при генерации ссылок (особенно когда мы прикрутим SSL).
    }
}
