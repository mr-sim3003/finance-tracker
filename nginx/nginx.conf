upstream django {
    # Обращаемся к контейнеру web по имени сервиса и порту, который слушает Gunicorn
    server web:8000;
}

server {
    listen 80;
    server_name localhost;

    # Максимальный размер загружаемых файлов (для импорта CSV)
    client_max_body_size 10M;

    # Статика (если есть CSS/JS в папке static/)
    location /static/ {
        alias /app/static/;
    }

    # Все остальные запросы идут в Django
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
