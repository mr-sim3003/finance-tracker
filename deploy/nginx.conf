# --- ЗАЩИТА ОТ СПАМА (Rate Limiting) ---
# Создаем зону в памяти (10 мегабайт) для хранения IP-адресов.
# Лимит: 10 запросов в секунду на один IP.
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

# django - имя переменная.
upstream django {
     server web:8000;
}

server {
    listen 80;
    server_name 194-113-35-11.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 194-113-35-11.sslip.io;

    ssl_certificate /etc/letsencrypt/live/194-113-35-11.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/194-113-35-11.sslip.io/privkey.pem;             
    client_max_body_size 10M;

    # --- ЗАЩИТА ---
    # Применяем лимит ко всем запросам (location /).
    # burst=20 позволяет кратковременно (всплеск) превысить лимит на 20 запросов.
    # nodelay означает, что если запрос в пределах burst, он обрабатывается сразу,
    # а если превышен — Nginx вернет ошибку 503 (а не будет ставить в очередь).
    limit_req zone=mylimit burst=20 nodelay;

    location /static/ {
        alias /app/staticfiles/;
    } 

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
                                                                    #proxy_set_header ... ---это самый важный блок для Django. Когда Nginx пересылает запрос, он по умолчанию скрывает реальные данные клиента.
                                                                    # Эти заголовки «пробрасывают» их внутрь:
                                                                    #Host $host — передает оригинальный домен (чтобы Django понимал, какой сайт запрашивают).
        proxy_set_header X-Real-IP $remote_addr;
                                                                    #X-Real-IP $remote_addr — передает реальный IP-адрес клиента 
                                                                    #(без этого Django будет думать, что запрос пришел от Nginx, то есть от 127.0.0.1).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                                                                    #X-Forwarded-For — стандартный заголовок для цепочки прокси (если серверов несколько).
        proxy_set_header X-Forwarded-Proto $scheme;
                                                                    #X-Forwarded-Proto $scheme — передает протокол (http или https). 
                                                                    #Это нужно, чтобы Django не сходил с ума при генерации ссылок (особенно при SSL).
    }
}
