services:                                           
  db:                                               
    image: postgres:15                                             
    environment:                                               
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:                                              
      test: ["CMD-SHELL", "pg_isready -U tracker_user -d tracker_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:                                              
      - postgres_data:/var/lib/postgresql/data/                                              
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  web:                                                   
    build: .                                               
    volumes:                                                  
      - .:/app
    depends_on:
      db:
        condition: service_healthy                         
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s                                    


  nginx:                                             
    image: nginx:alpine                                             
    ports:
      - "80:80"
      - "443:443"                                    
    volumes:                                               
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf   
      - ./staticfiles:/app/staticfiles
      - /etc/letsencrypt:/etc/letsencrypt:ro                                     
    depends_on:                                              
      - web

  celery: 
    build: .
    command: celery -A config worker --loglevel=info  # запускает воркер./ -A config — указывает на пакет config, где лежит celery.py./ worker — запускает процесс-исполнитель./ --loglevel=info — чтобы видеть в логах, как задачи берутся в работу.
    volumes:
      - .:/app
    depends_on: 
      - db
      - redis
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

volumes:                                                #    Это объявление именованного тома. Мы ссылались на него в сервисе db (postgres_data:/var/lib/postgresql/data/). Docker создаст его автоматически при первом запуске и будет хранить там данные PostgreSQL, даже если контейнеры удалены.
  postgres_data:
