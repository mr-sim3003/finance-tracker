# Главный блок, внутри которого перечислены все контейнеры (сервисы), из которых состоит твое приложение. 
services:                                             # Сейчас их три: db, web, nginx.
  db:                                               # имя сервиса. По этому имени другие контейнеры (например, web) будут к нему обращаться.
    image: postgres:15                                               # image: postgres:15 — говорит Docker: «Скачай готовый образ PostgreSQL 15-й версии с Docker Hub и запусти его».#Нам не нужно писать Dockerfile для базы, официальный образ уже настроен.
    environment:                                               # переменные окружения. Официальный образ PostgreSQL читает их при старте, чтобы создать базу и пользователя. Без них база не запустится.
      POSTGRES_DB: tracker_db
      POSTGRES_USER: tracker_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:                                                # это критически важный блок, который мы обсуждали. Docker сам будет запускать команду pg_isready каждые 5 секунд (interval). Если база не ответит за 5 секунд (timeout), попытка считается неудачной. Всего 5 попыток (retries). Пока статус не станет healthy, сервис web не запустится.
      test: ["CMD-SHELL", "pg_isready -U tracker_user -d tracker_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:                                               # это шов сохранности данных. Мы говорим: «Возьми папку /var/lib/postgresql/data/ внутри контейнера (там PostgreSQL хранит файлы БД) и привяжи её к именованному тому postgres_data на твоем хосте». Если контейнер удалить, данные останутся в томе.
      - postgres_data:/var/lib/postgresql/data/                                               #  Тома Docker виртуальная файловая система заполняющая фаловыми образами и уничтожающаяся при остановке контейнера.
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

# ports: - "5432:5432" — проброс порта. Левая часть (5432) — порт на твоем компьютере. 
# Правая часть (5432) — порт внутри контейнера. Это нужно, если ты хочешь подключиться к базе снаружи 
# (например, через DBeaver или pgAdmin). 
# Для самого Django это не обязательно, так как он общается с базой по внутренней сети Docker.
  web:                                                      # имя сервиса (внутреннее DNS-имя в Docker).
    build: .                                                # требования к сборкео браза строка,путь, подробное определение. #говорит: «Не скачивай готовый образ, а собери его из Dockerfile, который лежит в текущей папке (.).». Именно здесь выполняется pip install -r requirements.txt и копируется твой код.
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 # Переопределяет комнду контейнера использующуяся по умолчанию. вместо runserver используем gunicorn. command: ... — команда, которая запускается при старте контейнера. Вместо runserver мы используем gunicorn config.wsgi:application --bind 0.0.0.0:8000. Это продакшн-сервер. # config.wsgi:application — путь к WSGI-объекту (точке входа). #--bind 0.0.0.0:8000 — слушать все интерфейсы внутри контейнера на порту 8000.
    volumes:                                                    # Тома Docker виртуальная файловая система заполняющая фаловыми образами и уничтожающаяся при остановке контейнера. #— это шов для разработки. Мы монтируем твою локальную папку (.) в папку /app внутри контейнера. Это значит, что если ты изменишь код в VS Code, он сразу же изменится внутри контейнера. Без этого пришлось бы пересобирать образ после каждого изменения.
      - .:/app
    depends_on:                                               # Не запускай web, пока db не станет healthy». Это защита от падения Django при старте, когда база еще не готова принимать подключения.
      db:
        condition: service_healthy
    env_file:
      - .env                                               # читает переменные из файла .env (там SECRET_KEY, DEBUG, DATABASE_URL, ALLOWED_HOSTS). Это позволяет не хардкодить секреты в docker-compose.yml.


  nginx:                                               # имя сервиса.
    image: nginx:alpine                                                #скачивает официальный образ Nginx (на базе Alpine Linux — он очень легкий).
    ports:
      - "80:80"                                              #  важнейший проброс. Левая часть (80) — порт на твоем компьютере (именно туда ты стучишься из браузера). Правая часть (80) — порт внутри контейнера Nginx. Теперь браузер общается только с Nginx.
    volumes:                                               # Тома Docker виртуальная файловая система заполняющая фаловыми образами и уничтожающаяся при остановке контейнера.
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf   # ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf — заменяет дефолтный конфиг Nginx внутри контейнера на твой кастомный файл. Это позволяет тебе менять правила маршрутизации без пересборки образа.
      - ./static:/app/static                                              # пробрасывает папку со статикой (если она есть) внутрь Nginx, чтобы он мог отдавать CSS/JS напрямую.
    depends_on:                                               # Nginx запустится после web (но здесь нет условия healthy, потому что Nginx не падает, если Django еще не готов — он просто будет отдавать ошибку 502, пока Django не поднимется).
      - web

  celery: # # Команда для запуска воркера Celery
    build: .
    command: celery -A config worker --loglevel=info  # запускает воркер./ -A config — указывает на пакет config, где лежит celery.py./ worker — запускает процесс-исполнитель./ --loglevel=info — чтобы видеть в логах, как задачи берутся в работу.
    volumes:
      - .:/app
    depends_on:  # depends_on — ждем базу и Redis.
      - db
      - redis
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

volumes:                                                #    Это объявление именованного тома. Мы ссылались на него в сервисе db (postgres_data:/var/lib/postgresql/data/). Docker создаст его автоматически при первом запуске и будет хранить там данные PostgreSQL, даже если контейнеры удалены.
  postgres_data:
